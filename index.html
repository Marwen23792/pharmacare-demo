<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">

<style>body{margin:0}</style>

<style>
/* Layout: app shell — slim left rail of screens, working area on the right; stacks to a top tab strip on phones. */
:root{
  --bg:#eef3f1; --surface:#ffffff; --sunk:#f6f9f8; --ink:#11201b; --muted:#5b6c67; --line:#d5e0dc;
  --accent:#0a7357; --accent-soft:#dcefe8; --on-accent:#ffffff;
  --danger:#b42318; --danger-soft:#fde8e6; --warn:#9a5a05; --warn-soft:#fdf1dc; --ok:#137a3f; --ok-soft:#ddf3e5;
  --ctrlC:#137a3f;
  --f-display:"Bricolage Grotesque","IBM Plex Sans",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1412; --surface:#141f1c; --sunk:#101916; --ink:#e3ece9; --muted:#93a59f; --line:#253430;
  --accent:#3bbd92; --accent-soft:#16362c; --on-accent:#06140f;
  --danger:#f8776c; --danger-soft:#3a1714; --warn:#f5b64a; --warn-soft:#33250c; --ok:#4fd08f; --ok-soft:#12301f; --ctrlC:#4fd08f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1412; --surface:#141f1c; --sunk:#101916; --ink:#e3ece9; --muted:#93a59f; --line:#253430;
  --accent:#3bbd92; --accent-soft:#16362c; --on-accent:#06140f;
  --danger:#f8776c; --danger-soft:#3a1714; --warn:#f5b64a; --warn-soft:#33250c; --ok:#4fd08f; --ok-soft:#12301f; --ctrlC:#4fd08f; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body)}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:1.6rem} h2{font-size:1.15rem} h3{font-size:1rem}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}

.demo-band{background:var(--ink);color:var(--bg);font-size:.82rem;padding-block:6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.demo-band b{letter-spacing:.08em}
.demo-band a{color:inherit}
.app{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:calc(100vh - 34px)}
.rail{background:var(--surface);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:18px}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.cross{width:30px;height:30px;flex:none}
.brand strong{font-family:var(--f-display);font-size:1.2rem}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 10px;border-radius:7px;text-decoration:none;color:var(--ink);font-weight:500}
.nav a:hover{background:var(--sunk)}
.nav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.nav .k{font:500 .72rem var(--f-mono);color:var(--muted)}
.who{margin-top:auto;display:flex;flex-direction:column;gap:6px;font-size:.82rem;color:var(--muted)}
.who select{width:100%;padding:7px 8px;border:1px solid var(--line);border-radius:7px;background:var(--sunk)}
main{min-width:0;padding-block:24px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.head{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;justify-content:space-between}
.head p{margin:0;color:var(--muted)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.panel>h2,.panel>h3{margin-bottom:12px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(300px,1fr);gap:20px;align-items:start}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.tile .lbl{font-size:.75rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.tile .val{font:600 1.45rem var(--f-mono);font-variant-numeric:tabular-nums}
.tile .sub{font-size:.8rem;color:var(--muted)}

.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:8px 14px;cursor:pointer;font-weight:500}
.btn:hover{background:var(--sunk)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.primary:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn.big{padding:13px 18px;font-size:1.05rem;width:100%}
.btn.sm{padding:4px 10px;font-size:.85rem}
.btn.danger{color:var(--danger)}
.chip{border:1px solid var(--line);background:var(--sunk);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:.85rem}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}

label.f{display:flex;flex-direction:column;gap:4px;font-size:.82rem;color:var(--muted);min-width:0}
.row>label.f{flex:1 1 160px}
input.in,select.in{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:var(--sunk);color:var(--ink)}
input.in:focus{background:var(--surface)}
input.amt{text-align:right;font-family:var(--f-mono)}
.check{display:flex;gap:8px;align-items:center;cursor:pointer;font-weight:500}
.check input{width:18px;height:18px;accent-color:var(--accent)}

.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th{text-align:left;font-weight:600;font-size:.74rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
td.num{white-space:nowrap}
.muted{color:var(--muted)}
.small{font-size:.82rem}

.badge{display:inline-block;font:600 .7rem var(--f-mono);padding:1px 6px;border-radius:4px;vertical-align:1px;margin-left:6px;border:1px solid currentColor}
.badge.tA,.badge.tB{color:var(--danger);background:var(--danger-soft)}
.badge.tC{color:var(--ctrlC);background:var(--ok-soft)}
.badge.para{color:var(--muted)}
.pill{display:inline-block;font-size:.76rem;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--danger-soft);color:var(--danger)}
.pill.info{background:var(--accent-soft);color:var(--accent)}
.lot{display:inline-flex;gap:6px;font:.78rem var(--f-mono);border:1px solid var(--line);border-radius:5px;padding:1px 6px;margin:2px 4px 2px 0;white-space:nowrap}
.lot.warn{border-color:var(--warn);color:var(--warn)}
.lot.bad{border-color:var(--danger);color:var(--danger);text-decoration:line-through}

/* Caisse */
.search{position:relative}
.search input{font-size:1.05rem;padding:12px 14px}
.results{position:absolute;z-index:5;left:0;right:0;top:calc(100% + 4px);background:var(--surface);border:1px solid var(--line);border-radius:9px;box-shadow:0 10px 30px rgb(0 0 0 / .14);max-height:340px;overflow:auto}
.res{display:flex;justify-content:space-between;gap:12px;padding:10px 14px;cursor:pointer;border-bottom:1px solid var(--line)}
.res:last-child{border-bottom:0}
.res:hover,.res.first{background:var(--sunk)}
.res .gen{font-size:.8rem;color:var(--ok)}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.qty button{border:0;background:var(--sunk);width:28px;height:28px;cursor:pointer}
.qty span{min-width:30px;text-align:center;font-family:var(--f-mono)}
.empty{padding:28px 12px;text-align:center;color:var(--muted)}
.sum{display:flex;flex-direction:column;gap:6px}
.sum .l{display:flex;justify-content:space-between;gap:12px}
.sum .l .num{font-weight:500}
.sum .due{border-top:1px solid var(--line);padding-top:10px;margin-top:4px;align-items:baseline}
.sum .due .num{font-size:1.9rem;font-weight:600}
.change{border-radius:8px;padding:10px 12px;display:flex;justify-content:space-between;font-weight:600}
.change.ok{background:var(--ok-soft);color:var(--ok)}
.change.rest{background:var(--warn-soft);color:var(--warn)}
.err{background:var(--danger-soft);color:var(--danger);border-radius:8px;padding:10px 12px;font-weight:500}
.note{background:var(--sunk);border:1px dashed var(--line);border-radius:8px;padding:10px 12px;font-size:.85rem;color:var(--muted)}
.rx{border-left:3px solid var(--danger);background:var(--danger-soft);border-radius:0 8px 8px 0;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.rx h3{color:var(--danger)}
.rx .in{background:var(--surface)}
.cnam{border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 8px 8px 0;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.cnam .in{background:var(--surface)}
.kbd{font:500 .72rem var(--f-mono);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;color:var(--muted);background:var(--sunk)}

/* Bandeaux registre */
.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;border-radius:10px;padding:12px 16px;font-weight:500}
.banner.ok{background:var(--ok-soft);color:var(--ok)}
.banner.bad{background:var(--danger-soft);color:var(--danger)}

/* Ticket modal */
.overlay{position:fixed;inset:0;background:rgb(6 14 11 / .55);z-index:50;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding-block:calc(24px + env(safe-area-inset-top,0px)) 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.modal{display:flex;flex-direction:column;gap:12px;align-items:stretch;width:min(100%,360px)}
.paper{background:#fffef9;color:#1a1a1a;font:12.5px/1.45 var(--f-mono);font-variant-numeric:tabular-nums;padding:18px 16px 22px;box-shadow:0 12px 40px rgb(0 0 0 / .3);border-radius:2px}
.paper .c{text-align:center}
.paper .l{display:flex;justify-content:space-between;gap:10px}
.paper hr{border:0;border-top:1px dashed #888;margin:8px 0}
.paper .big{font-weight:600;font-size:14px}
.paper .i{padding-left:10px;color:#555}
.modal .acts{display:flex;gap:8px}
.modal .acts .btn{flex:1}

.denoms{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.denoms label{display:flex;flex-direction:column;gap:3px;font:.8rem var(--f-mono);color:var(--muted)}
.ocr{background:var(--surface);color:var(--ink);border-radius:12px;width:min(100%,1100px);padding:18px;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 60px rgb(0 0 0 / .3)}
.ocr-head{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.ocr-head h2{margin-right:auto}
.ocr-grid{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:18px;align-items:start}
.ocr-left,.ocr-right{display:flex;flex-direction:column;gap:12px;min-width:0}
.ocr-img{width:100%;border:1px solid var(--line);border-radius:6px;max-height:520px;object-fit:contain;background:#fbfaf4}
@media (max-width:900px){.ocr-grid{grid-template-columns:1fr}}
.lock{display:flex;flex-direction:column;gap:8px;align-items:flex-start}

.who b{color:var(--ink);font-weight:600}
.login{position:fixed;inset:0;z-index:40;background:var(--bg);overflow:auto;display:flex;align-items:center;justify-content:center;padding-block:calc(48px + env(safe-area-inset-top,0px)) 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.login-wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,420px);width:min(100%,920px);background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 20px 50px rgb(10 40 30 / .08)}
.login-side{background:var(--accent);color:var(--on-accent);padding:36px 32px;display:flex;flex-direction:column;gap:18px;position:relative;overflow:hidden}
.login-side h2{font-size:1.7rem;line-height:1.15;color:inherit}
.login-side p{margin:0;opacity:.9;line-height:1.5}
.login-side ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px;font-size:.92rem}
.login-side li{display:flex;gap:10px;align-items:flex-start}
.login-side li::before{content:"+";font:700 1rem var(--f-mono);opacity:.75}
.login-side .crosses{position:absolute;right:-40px;bottom:-40px;width:220px;height:220px;opacity:.12}
.login-card{padding:32px 28px;display:flex;flex-direction:column;gap:14px;min-width:0}
@media (min-width:761px){.login-card .brand{display:none}}
@media (max-width:760px){.login-wrap{grid-template-columns:1fr}.login-side{display:none}.login{align-items:flex-start}}
.login-card .brand{padding:0}
.accts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.acct{border:1px solid var(--line);border-radius:9px;padding:10px 12px;background:var(--sunk);cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:2px}
.acct small{color:var(--muted)}
.acct[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.hint{font:.8rem var(--f-mono);color:var(--muted);background:var(--sunk);border-radius:7px;padding:8px 10px}
.otp{font:600 1.4rem var(--f-mono);letter-spacing:.4em;text-align:center}
.pill.neutral{background:var(--sunk);color:var(--muted)}
.mode{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.mode button{border:0;background:var(--surface);padding:7px 12px;cursor:pointer;font-weight:500}
.mode button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
@media (max-width:600px){.hide-sm{display:none}}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto 1fr}
  .rail{min-width:0}
  .rail{border-right:0;border-bottom:1px solid var(--line);padding:10px max(12px,env(safe-area-inset-right,0px)) 10px max(12px,env(safe-area-inset-left,0px));gap:10px}
  .brand{display:none}
  .nav{flex-direction:row;overflow-x:auto;gap:4px}
  .nav a{white-space:nowrap;padding:7px 10px}
  .nav .k{display:none}
  .who{margin-top:0;flex-direction:row;align-items:center;flex-wrap:wrap}
  .who span{white-space:nowrap}
  .grid2{grid-template-columns:1fr}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div class="demo-band">
  <span><b>DÉMO</b> · données fictives, tout reste dans votre navigateur et disparaît au rechargement.</span>
  <a href="https://github.com/Marwen23792/pharmacare" target="_blank" rel="noopener">Code source sur GitHub</a>
</div>
<div class="app">
  <aside class="rail">
    <div class="brand">
      <svg class="cross" viewBox="0 0 30 30" aria-hidden="true"><rect width="30" height="30" rx="7" fill="var(--accent)"/><path d="M12 6h6v6h6v6h-6v6h-6v-6H6v-6h6z" fill="var(--on-accent)"/></svg>
      <strong>PharmaCare</strong>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="who" id="who"></div>
  </aside>
  <main><div class="wrap" id="view"></div></main>
</div>
<div class="overlay" id="overlay" hidden></div>
<div class="login" id="login" hidden></div>

<script>
"use strict";
document.documentElement.lang = "fr";
/* ---------- utilitaires ---------- */
const NOW = new Date();
const pad = n => String(n).padStart(2, "0");
const ym = (d) => d.getFullYear() + "-" + pad(d.getMonth() + 1);
const addMonths = n => { const d = new Date(NOW.getFullYear(), NOW.getMonth() + n, 1); return ym(d); };
const daysAgo = n => new Date(NOW.getTime() - n * 864e5);
const endOfMonth = s => { const [y, m] = s.split("-").map(Number); return new Date(y, m, 0, 23, 59, 59); };
const monthsLeft = s => (endOfMonth(s) - NOW) / (30.4 * 864e5);
const fdate = d => pad(d.getDate()) + "/" + pad(d.getMonth() + 1) + "/" + d.getFullYear();
const ftime = d => pad(d.getHours()) + ":" + pad(d.getMinutes());
const fexp = s => s.slice(5) + "/" + s.slice(0, 4);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const norm = s => String(s).normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
/* montants en millimes (le dinar a 3 décimales) */
function fmt(m) {
  const neg = m < 0; m = Math.abs(Math.round(m));
  const d = Math.floor(m / 1000), r = String(m % 1000).padStart(3, "0");
  return (neg ? "−" : "") + String(d).replace(/\B(?=(\d{3})+(?!\d))/g, " ") + "," + r;
}
function parseDT(s) {
  s = String(s ?? "").trim().replace(/\s/g, "").replace(",", ".");
  if (!s) return 0;
  const n = Number(s);
  return isFinite(n) && n >= 0 ? Math.round(n * 1000) : NaN;
}
function hash(str) { let h = 0x811c9dc5; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; } return h.toString(16).padStart(8, "0"); }
function vatBreak(lines) {
  const by = {};
  for (const l of lines) by[l.vat] = (by[l.vat] || 0) + l.ttc;
  return Object.keys(by).map(Number).sort((a, b) => a - b).map(rate => {
    const ttc = by[rate], ht = Math.round(ttc * 100 / (100 + rate));
    return { rate, ttc, ht, tva: ttc - ht };
  });
}

/* ---------- données de démonstration ---------- */
const P = (id, code, name, dci, price, vat, table, remb, min, lots) => ({ id, code, name, dci, price, vat, table, remb, min, lots: lots.map(([no, m, qty]) => ({ no, exp: addMonths(m), qty })) });
const S = {
  user: "pharm",
  cnamMode: "REMBOURSEMENT", // tiers payant suspendu dans les pharmacies privées depuis le 8 décembre 2025
  auth: { in: false, who: "pharm", step: "pwd", fails: {}, pwd: "officine-tunis", otp: "246810", msg: "" },
  users: {
    pharm: { name: "Dr Fares Ben Salem", role: "Pharmacien titulaire", pharmacist: true, login: "fares", twofa: true },
    caisse: { name: "Amine Trabelsi", role: "Caissier", pharmacist: false, login: "amine", twofa: false },
  },
  products: [
    P("p1", "6191234500011", "Doliprane 1000 mg cp B/8", "paracétamol", 2350, 7, null, true, 30, [["L2402C", 1, 6], ["L2411A", 22, 64]]),
    P("p2", "6191234500028", "Paralgan 1 g cp B/8", "paracétamol", 1900, 7, null, true, 20, [["PG0925", 14, 40]]),
    P("p3", "6191234500035", "Augmentin 1 g/125 mg sachets B/12", "amoxicilline + ac. clavulanique", 12800, 7, null, true, 10, [["AU7731", -1, 3], ["AU8102", 9, 18]]),
    P("p4", "6191234500042", "Glucophage 850 mg cp B/30", "metformine", 4650, 7, null, true, 15, [["GL5521", 16, 42]]),

const prod = id => S.products.find(p => p.id === id);
const usable = l => l.qty > 0 && endOfMonth(l.exp) >= NOW;
const avail = p => p.lots.filter(usable).reduce((s, l) => s + l.qty, 0);
const nextLot = p => p.lots.filter(usable).sort((a, b) => a.exp.localeCompare(b.exp))[0];
function fefo(p, qty) {
  const lots = p.lots.filter(usable).sort((a, b) => a.exp.localeCompare(b.exp));
  let need = qty; const picks = [];
  for (const l of lots) { if (!need) break; const t = Math.min(need, l.qty); picks.push({ lot: l, qty: t }); need -= t; }
  if (need > 0) throw new Error(`Stock insuffisant pour ${p.name} : ${qty - need} boîte(s) disponible(s).`);
  return picks;
}
function lineCalc(l) {
  const p = prod(l.pid), gross = p.price * l.qty;
  const disc = p.vat === 19 ? Math.round(gross * (l.disc || 0) / 100) : 0;
  return { p, gross, disc, ttc: gross - disc };
}
function cnamRate(c) { return c.apci ? 100 : 70; }
/* tarif de référence CNAM par unité (millimes) : la CNAM rembourse sur ce tarif, le patient paie la différence */
const REF = { p1: 2300, p2: 1900, p3: 12500, p4: 4600, p5: 8900, p6: 6100, p7: 18900, p8: 3450, p9: 5780 };
function basketTotals(basket, cnam) {
  const calc = basket.map(lineCalc);
  const total = calc.reduce((s, c) => s + c.ttc, 0);
  const disc = calc.reduce((s, c) => s + c.disc, 0);
  const rembBase = calc.reduce((s, c, i) => s + (c.p.remb ? Math.min(c.ttc, REF[c.p.id] ? REF[c.p.id] * basket[i].qty : c.ttc) : 0), 0);
  const cnamShare = cnam.on ? Math.round(rembBase * cnamRate(cnam) / 100) : 0;
  const tp = S.cnamMode === "TIERS_PAYANT";
  const partCnam = tp ? cnamShare : 0;
  return { calc, total, disc, rembBase, cnamShare, partCnam, refundable: tp ? 0 : cnamShare, due: total - partCnam };
}

/* registre : chaînage des empreintes */
function ordHash(e, prev) { return hash(prev + "|" + [e.no, e.date.toISOString(), e.product, e.lot, e.qty, e.presc, e.patient, e.pharm].join("|")); }
function ordIntact() {
  let prev = "0";
  for (const e of S.ord) { if (ordHash(e, prev) !== e.h) return e.no; prev = e.h; }
  return null;
}

/* ---------- vente (mêmes règles que pc_complete_sale) ---------- */
function completeSale(o) {
  const user = S.users[o.user];
  if (!o.basket.length) throw new Error("Le panier est vide.");
  const t = basketTotals(o.basket, o.cnam);
  const ctrl = t.calc.filter(c => c.p.table);
  if (ctrl.length) {
    if (!user.pharmacist) throw new Error("Délivrance réservée au pharmacien : un produit des tableaux A, B ou C est dans le panier.");
    if (!o.rx.presc.trim() || !o.rx.patient.trim() || !o.rx.date) throw new Error("Ordonnance obligatoire : prescripteur, patient et date.");
    if (new Date(o.rx.date) > NOW) throw new Error("La date de l'ordonnance ne peut pas être dans le futur.");
    if (ctrl.some(c => c.p.table === "B") && (!o.rx.adrP.trim() || !o.rx.adrPr.trim())) throw new Error("Tableau B : adresses du patient et du prescripteur obligatoires.");
  }
  if (o.cnam.on && !o.cnam.assure.trim()) throw new Error("CNAM : saisir le n° d'assuré.");
  const card = parseDT(o.pay.card), cash = parseDT(o.pay.cash);
  if (isNaN(card) || isNaN(cash)) throw new Error("Montant de règlement invalide.");
  if (card > t.due) throw new Error("Le montant carte dépasse le montant à payer.");
  if (card + cash < t.due) throw new Error(`Reste à payer : ${fmt(t.due - card - cash)} DT.`);
  // prélèvement FEFO : tout est vérifié avant de toucher au stock
  const picks = t.calc.map(c => fefo(c.p, o.basket.find(b => b.pid === c.p.id).qty));
  picks.forEach(ps => ps.forEach(pk => { pk.lot.qty -= pk.qty; }));
  const at = o.at || new Date();
  const no = "T" + at.getFullYear() + "-" + String(++S.ticketSeq).padStart(6, "0");
  const lines = t.calc.map((c, i) => ({ name: c.p.name, table: c.p.table, vat: c.p.vat, qty: o.basket[i].qty, price: c.p.price, disc: c.disc, ttc: c.ttc, remb: c.p.remb, lots: picks[i].map(pk => ({ no: pk.lot.no, exp: pk.lot.exp, qty: pk.qty })) }));
  const change = card + cash - t.due;
  const sale = { no, at, user: user.name, lines, total: t.total, disc: t.disc, partCnam: t.partCnam, due: t.due, card, cash, change, cashNet: cash - change,
    cnam: o.cnam.on ? { ...o.cnam, rate: cnamRate(o.cnam), mode: S.cnamMode, share: t.cnamShare, base: t.rembBase } : null, rx: ctrl.length ? { ...o.rx } : null, vat: vatBreak(lines) };
  S.sales.push(sale);
  // ordonnancier : transcription automatique, une ligne par lot
  lines.forEach(l => { if (!l.table) return; l.lots.forEach(lt => {
    const prev = S.ord.length ? S.ord[S.ord.length - 1].h : "0";
    const e = { no: ++S.ordSeq, date: at, product: l.name, table: l.table, lot: lt.no, qty: lt.qty, presc: o.rx.presc.trim(), patient: o.rx.patient.trim(), pharm: user.name, ticket: no };
    e.h = ordHash(e, prev); S.ord.push(e);
  }); });
  if (sale.cnam) S.dossiers.push({ id: "D-" + no.slice(1), at, assure: o.cnam.assure.trim(), benef: o.cnam.benef, regime: o.cnam.regime, apci: o.cnam.apci,
    amount: t.cnamShare, status: S.cnamMode === "TIERS_PAYANT" ? "attente" : "patient", bord: null, ticket: no });
  return sale;
}

          <div class="num">${fmt(p.price)}</div></div>`; }).join("")}</div>` : S.q.trim() ? `<div class="results"><div class="empty">Aucun produit pour « ${esc(S.q)} »</div></div>` : ""}
      </div>
      <div class="panel" style="padding:0">
        ${S.basket.length ? `<div class="tbl-wrap"><table><thead><tr><th>Produit</th><th>Qté</th><th class="r hide-sm">PU</th><th class="hide-sm">Remise</th><th class="r">Total</th><th></th></tr></thead><tbody>

        ${S.cnam.on ? `<div class="row">

      ${S.basket.length ? (rest > 0 ? `<div class="change rest"><span>Reste à payer</span><span class="num">${fmt(rest)}</span></div>` : `<div class="change ok"><span>Rendu monnaie</span><span class="num">${fmt(-rest)}</span></div>`) : ""}
      ${S.error ? `<div class="err" role="alert">${esc(S.error)}</div>` : ""}
      ${S.cnam.on && t.refundable ? `<div class="note">Remboursement CNAM à demander par le patient : <b class="num">${fmt(t.refundable)} DT</b> (${cnamRate(S.cnam)} % du tarif de référence ${fmt(t.rembBase)}). Une attestation est imprimée avec le ticket.</div>` : ""}
      <button class="btn primary big" data-act="pay" ${canPay ? "" : "disabled"}>Encaisser ${S.basket.length ? fmt(t.due) + " DT" : ""}</button>
      ${S.basket.length ? `<div class="small muted">TVA incluse : ${vatBreak(t.calc.map(c => ({ vat: c.p.vat, ttc: c.ttc }))).map(v => `${v.rate} % → ${fmt(v.tva)}`).join(" · ")}</div>` : ""}
    </div>
  </div>`;
}
function scenario(s) {
  S.basket = []; S.error = ""; S.q = ""; S.pay = { cash: "", card: "" };
  S.cnam = { on: false, apci: false, regime: "Filière publique", assure: "", benef: "Assuré" };
  S.rx = { presc: "", patient: "", date: "", adrP: "", adrPr: "" };
  const d = new Date(NOW.getTime() - 864e5), iso = d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  if (s === "simple") { S.basket = [{ pid: "p1", qty: 2 }, { pid: "p9", qty: 1 }]; S.pay.cash = "20"; }
  if (s === "cnam") { S.basket = [{ pid: "p4", qty: 3 }, { pid: "p5", qty: 1 }, { pid: "p12", qty: 1 }]; S.cnam = { on: true, apci: true, regime: "Filière publique", assure: "330981-45", benef: "Assuré" }; }
  if (s === "tabB") { S.basket = [{ pid: "p7", qty: 1 }]; S.rx = { presc: "Dr Nabil Haddad", patient: "Mohamed R.", date: iso, adrP: "", adrPr: "" }; }
  if (s === "para") { S.basket = [{ pid: "p11", qty: 1, disc: 10 }, { pid: "p10", qty: 1, disc: 0 }]; }
  location.hash = "caisse"; render();
}
function addToBasket(id) {
  const p = prod(id), i = S.basket.findIndex(b => b.pid === id);
  if (i >= 0) S.basket[i].qty++; else S.basket.push({ pid: id, qty: 1, disc: 0 });
  S.q = ""; S.error = avail(p) < (S.basket.find(b => b.pid === id).qty) ? `Stock insuffisant pour ${p.name} : ${avail(p)} disponible(s).` : "";
}
function pay() {
  try {
    const sale = completeSale({ user: S.user, basket: S.basket, cnam: S.cnam, rx: S.rx, pay: S.pay });
    S.basket = []; S.pay = { cash: "", card: "" }; S.error = "";
    S.cnam = { on: false, apci: false, regime: "Filière publique", assure: "", benef: "Assuré" };
    S.rx = { presc: "", patient: "", date: "", adrP: "", adrPr: "" };
    render(); showTicket(sale);
  } catch (e) { S.error = e.message; render(); }
}
function showTicket(s) {
  const L = (a, b, cls = "") => `<div class="l ${cls}"><span>${a}</span><span>${b}</span></div>`;
  const o = document.getElementById("overlay");
  o.innerHTML = `<div class="modal" role="dialog" aria-label="Ticket ${s.no}"><div class="paper">
    <div class="c big">PHARMACIE DE DÉMONSTRATION</div>
    <div class="c">12 avenue Habib Bourguiba, Tunis</div><div class="c">MF : 0000000/X/A/M/000 (fictif)</div><hr>
    ${L("Ticket " + s.no, "")}${L(fdate(s.at) + " " + ftime(s.at), esc(s.user))}<hr>
    ${s.lines.map(l => `<div>${esc(l.name)}${l.table ? " [" + l.table + "]" : ""}</div>${L(`<span class="i">${l.qty} × ${fmt(l.price)}</span>`, fmt(l.qty * l.price))}
      ${l.disc ? L('<span class="i">remise</span>', fmt(-l.disc)) : ""}${l.lots.map(lt => `<div class="i">lot ${lt.no} · exp ${fexp(lt.exp)}${l.lots.length > 1 ? " · " + lt.qty : ""}</div>`).join("")}`).join("")}<hr>
    ${L("TOTAL TTC", fmt(s.total), "big")}
    ${s.cnam && s.partCnam ? L(`Part CNAM (${s.cnam.rate} %)`, fmt(-s.partCnam)) + L("PART ASSURÉ", fmt(s.due), "big") : ""}
    ${s.cnam && !s.partCnam ? L("Remboursable CNAM", fmt(s.cnam.share)) + `<div class="i">à demander avec l'attestation, l'ordonnance et les vignettes</div>` : ""}
    ${s.card ? L("Carte", fmt(s.card)) : ""}${s.cash ? L("Espèces", fmt(s.cash)) : ""}${s.change ? L("Rendu", fmt(s.change)) : ""}<hr>
    ${L("TVA", "Base HT · Montant")}${s.vat.map(v => L(v.rate + " %", fmt(v.ht) + " · " + fmt(v.tva))).join("")}
    ${s.cnam ? `<hr><div>CNAM ${esc(s.cnam.regime)} · n° ${esc(s.cnam.assure)} · ${esc(s.cnam.benef)}${s.cnam.apci ? " · APCI" : ""}</div>` : ""}
    ${s.rx ? `<hr><div>Ordonnance du ${esc(s.rx.date.split("-").reverse().join("/"))}</div><div>${esc(s.rx.presc)} · patient ${esc(s.rx.patient)}</div>` : ""}
    <hr><div class="c">Merci de votre visite</div></div>
    <div class="acts"><button class="btn primary" data-act="close">Nouvelle vente</button>${s.rx ? `<a class="btn" href="#ordonnancier" data-act="close">Voir l'ordonnancier</a>` : ""}</div>
    <div class="small" style="color:#fff;opacity:.85;text-align:center">Dans l'application, le ticket s'imprime au format 80 mm.</div></div>`;
  o.hidden = false; o.querySelector(".btn").focus();
}

/* ---------- Stock ---------- */
function vStock() {
  const q = norm(S.stockQ), f = S.stockFilter;
  const rows = S.products.filter(p => (!q || norm(p.name + " " + p.dci + " " + p.code).includes(q)) &&
    (f === "all" || (f === "exp" && p.lots.some(l => l.qty && monthsLeft(l.exp) < 3)) || (f === "low" && avail(p) < p.min) || (f === "ctrl" && p.table)));
  const val = S.products.reduce((s, p) => s + avail(p) * Math.round(p.price * 0.7), 0);
  return `<div class="head"><div><h1>Produits & stock</h1><p>${S.products.length} produits · valeur estimée au prix d'achat ${fmt(val)} DT</p></div></div>
  <div class="row"><input class="in" id="stockQ" data-bind="stockQ" value="${esc(S.stockQ)}" placeholder="Filtrer : nom, DCI, code-barres" style="max-width:340px">
    ${[["all", "Tous"], ["exp", "Péremption < 3 mois"], ["low", "Sous le minimum"], ["ctrl", "Tableaux A, B, C"]].map(([k, l]) => `<button class="chip" data-act="sf" data-f="${k}" aria-pressed="${f === k}">${l}</button>`).join("")}</div>
  <div class="panel" style="padding:0"><div class="tbl-wrap"><table>
    <thead><tr><th>Produit</th><th>DCI</th><th class="r">Prix TTC</th><th>TVA</th><th>Lots (FEFO)</th><th class="r">Stock</th><th>État</th></tr></thead><tbody>
    ${rows.map(p => { const a = avail(p); const lots = [...p.lots].sort((x, y) => x.exp.localeCompare(y.exp));
      return `<tr><td><div>${esc(p.name)}${tableBadge(p.table)}</div><div class="small muted mono">${p.code}</div></td><td class="small">${esc(p.dci || "—")}</td>
      <td class="r num">${fmt(p.price)}</td><td class="num">${p.vat} %</td>
      <td>${lots.map(l => `<span class="lot ${!usable(l) && l.qty ? "bad" : monthsLeft(l.exp) < 3 && l.qty ? "warn" : ""}">${l.no} · ${fexp(l.exp)} · ${l.qty}</span>`).join("")}</td>
      <td class="r num">${a}<span class="muted"> / ${p.min}</span></td>
      <td>${a === 0 ? '<span class="pill bad">Rupture</span>' : a < p.min ? '<span class="pill warn">À commander</span>' : '<span class="pill ok">OK</span>'}</td></tr>`; }).join("") || `<tr><td colspan="7" class="empty">Aucun produit.</td></tr>`}
    </tbody></table></div></div>
  <div class="note">La quantité d'un lot ne change que par un mouvement de stock enregistré (réception, vente, retour, inventaire, échange) et ne peut jamais devenir négative. Les prix de vente sont l'historique des prix officiels, jamais écrasé.</div>`;
}

/* ---------- Ordonnancier ---------- */
function vOrd() {
  if (!me().pharmacist) return `<div class="head"><h1>Ordonnancier</h1></div>` + lockMsg("L'ordonnancier");
  const bad = ordIntact(), q = norm(S.ordQ);
  const rows = S.ord.filter(e => !q || norm(e.product + " " + e.patient + " " + e.presc).includes(q)).slice().reverse();
  return `<div class="head"><div><h1>Ordonnancier</h1><p>Registre des délivrances des tableaux A, B et C · conservation 10 ans</p></div></div>
  <div class="banner ${bad ? "bad" : "ok"}"><span>${bad ? `Registre altéré : l'entrée n° ${bad} ne correspond plus à son empreinte. Une modification hors du logiciel a été détectée.` : `Registre intègre · ${S.ord.length} entrées, chaque ligne est scellée par l'empreinte de la précédente.`}</span>
    ${bad ? `<button class="btn sm" data-act="untamper">Annuler la falsification</button>` : `<button class="btn sm" data-act="tamper" title="Modifie une ligne en mémoire, comme le ferait quelqu'un qui édite la base directement">Simuler une falsification</button>`}</div>
  <input class="in" id="ordQ" data-bind="ordQ" value="${esc(S.ordQ)}" placeholder="Rechercher un patient, un produit, un prescripteur" style="max-width:380px">
  <div class="panel" style="padding:0"><div class="tbl-wrap"><table>
    <thead><tr><th>N° d'ordre</th><th>Date</th><th>Produit</th><th>Lot</th><th class="r">Qté</th><th>Prescripteur</th><th>Patient</th><th>Pharmacien</th><th>Empreinte</th></tr></thead><tbody>
    ${rows.map(e => `<tr><td class="num">${e.no}</td><td class="num">${fdate(e.date)} ${ftime(e.date)}</td><td>${esc(e.product)}${tableBadge(e.table)}</td><td class="mono small">${e.lot}</td><td class="r num">${e.qty}</td><td>${esc(e.presc)}</td><td>${esc(e.patient)}</td><td class="small">${esc(e.pharm)}</td><td class="mono small ${bad === e.no ? "" : "muted"}" style="${bad === e.no ? "color:var(--danger)" : ""}">${e.h}</td></tr>`).join("") || `<tr><td colspan="9" class="empty">Aucune entrée.</td></tr>`}
    </tbody></table></div></div>
  <div class="note">Les lignes ne peuvent être ni modifiées ni supprimées : un retour crée une ligne négative qui renvoie au numéro d'origine. Les numéros se suivent sans trou.</div>`;
}

/* ---------- CNAM ---------- */
function vCnam() {
  const open = S.dossiers.filter(d => d.status !== "paye" && d.status !== "patient");
  const age = d => (NOW - d.at) / 864e5;
  const buckets = [["0 à 30 jours", 0, 30], ["31 à 60 jours", 31, 60], ["61 à 90 jours", 61, 90], ["Plus de 90 jours", 91, 1e9]].map(([l, a, b]) => { const ds = open.filter(d => age(d) >= a && age(d) < b + 1); return { l, n: ds.length, s: ds.reduce((x, d) => x + d.amount, 0), late: a > 90 }; });
  const pending = S.dossiers.filter(d => d.status === "attente");
  const st = { patient: ['neutral', "Remboursement patient"], attente: ['info', "À mettre en bordereau"], bord: ['warn', "En bordereau"], depose: ['warn', "Déposé"], paye: ['ok', "Payé"] };
  const bst = { prepare: ['info', "Préparé"], depose: ['warn', "Déposé à la CNAM"], paye: ['ok', "Payé"] };
  return `<div class="head"><div><h1>CNAM</h1><p>Créances, bordereaux et dossiers</p></div>
    <button class="btn primary" data-act="bord" ${pending.length ? "" : "disabled"}>Créer un bordereau (${pending.length} dossier${pending.length > 1 ? "s" : ""})</button></div>
  <div class="panel row" style="justify-content:space-between">
    <div style="flex:1 1 320px;min-width:0"><h3>Mode de prise en charge</h3>
      <p class="small muted" style="margin:6px 0 0">${S.cnamMode === "TIERS_PAYANT" ? "Tiers payant : la CNAM paie sa part à la pharmacie (bordereaux), le patient paie le reste." : "Remboursement : le tiers payant est suspendu dans les pharmacies privées depuis le 8 décembre 2025. Le patient paie tout et se fait rembourser avec l'attestation, l'ordonnance et les vignettes."}</p></div>
    <div class="mode" role="group" aria-label="Mode CNAM"><button data-act="cnam-mode" data-m="TIERS_PAYANT" aria-pressed="${S.cnamMode === "TIERS_PAYANT"}">Tiers payant</button><button data-act="cnam-mode" data-m="REMBOURSEMENT" aria-pressed="${S.cnamMode === "REMBOURSEMENT"}">Remboursement</button></div>
  </div>
  <div class="tiles">${buckets.map(b => `<div class="tile"><span class="lbl">${b.l}</span><span class="val" style="${b.late && b.n ? "color:var(--danger)" : ""}">${fmt(b.s)}</span><span class="sub">DT · ${b.n} dossier${b.n > 1 ? "s" : ""}</span></div>`).join("")}</div>
  <div class="panel"><h2>Bordereaux</h2><div class="tbl-wrap"><table><thead><tr><th>N°</th><th>Période</th><th class="r">Dossiers</th><th class="r">Montant</th><th>Statut</th><th></th></tr></thead><tbody>
    ${S.bordereaux.slice().reverse().map(b => { const ds = S.dossiers.filter(d => d.bord === b.no); return `<tr><td class="num">${b.no}</td><td class="num">${fdate(b.from)} → ${fdate(b.to)}</td><td class="r num">${ds.length}</td><td class="r num">${fmt(ds.reduce((x, d) => x + d.amount, 0))}</td>
      <td><span class="pill ${bst[b.status][0]}">${bst[b.status][1]}</span></td>
      <td>${b.status === "prepare" ? `<button class="btn sm" data-act="bdep" data-no="${b.no}">Marquer déposé</button>` : b.status === "depose" ? `<button class="btn sm" data-act="bpay" data-no="${b.no}">Enregistrer le paiement</button>` : ""}</td></tr>`; }).join("")}
  </tbody></table></div></div>
  <div class="panel"><h2>Dossiers</h2><div class="tbl-wrap"><table><thead><tr><th>Date</th><th>Assuré</th><th>Bénéficiaire</th><th>Régime</th><th class="r">Part CNAM</th><th>Statut</th></tr></thead><tbody>
    ${S.dossiers.slice().sort((a, b) => b.at - a.at).map(d => `<tr><td class="num">${fdate(d.at)}</td><td class="mono">${esc(d.assure)}</td><td>${esc(d.benef)}${d.apci ? ' <span class="pill info">APCI</span>' : ""}</td><td class="small">${esc(d.regime)}</td><td class="r num">${fmt(d.amount)}</td>

function drawRx(rx) {
  const c = document.createElement("canvas"); c.width = 900; c.height = 1180;
  const g = c.getContext("2d");
  g.fillStyle = "#fbfaf4"; g.fillRect(0, 0, 900, 1180);
  g.fillStyle = "#1d3557"; g.font = "600 30px 'IBM Plex Sans', sans-serif"; g.fillText(rx.doctor, 60, 80);
  g.font = "22px 'IBM Plex Sans', sans-serif"; g.fillText(rx.spec + " · " + rx.addr, 60, 115);
  g.fillText("Tél. 71 000 000 · Conventionné CNAM", 60, 145);
  g.strokeStyle = "#1d3557"; g.lineWidth = 2; g.beginPath(); g.moveTo(60, 170); g.lineTo(840, 170); g.stroke();

  rx.lines.forEach(([drug, poso], i) => {
    g.save(); g.translate(0, y); g.rotate((i % 2 ? -1 : 1) * 0.008);

  const rows = o.lines.map((l, i) => {
    const p = l.pid && prod(l.pid), a = p ? avail(p) : 0, low = l.confiance < 0.8;
    const gen = p && a < l.qty * (BOX[p.id] ? 1 : 1) ? S.products.find(x => x.id !== p.id && x.dci && x.dci === p.dci && avail(x) >= l.qty) : null;
    return `<tr>
      <td><input type="checkbox" data-ocr="take" data-i="${i}" ${l.take ? "checked" : ""} ${l.pid ? "" : "disabled"} aria-label="Délivrer"></td>
      <td><div class="mono small">« ${esc(l.lu)} »</div><div class="small muted">${esc(l.posologie)}</div>
        <span class="pill ${low ? "warn" : "ok"}">${low ? "à vérifier" : "lu"} · ${Math.round(l.confiance * 100)} %</span></td>
      <td><select class="in" data-ocr="pid" data-i="${i}" style="min-width:180px">${prodOpts(l.pid)}</select>
        ${p ? `<div class="small ${a < l.qty ? "" : "muted"}" style="${a < l.qty ? "color:var(--danger)" : ""}">stock ${a}${a < l.qty ? " — insuffisant" : ""}</div>` : `<div class="small" style="color:var(--warn)">non trouvé : choisissez</div>`}
        ${gen ? `<button class="btn sm" data-ocr="gen" data-i="${i}" data-p="${gen.id}">Remplacer par ${esc(gen.name)} (stock ${avail(gen)})</button>` : ""}</td>
      <td class="r"><input class="in amt" style="width:64px" inputmode="numeric" data-ocr="qty" data-i="${i}" value="${l.qty}"><div class="small muted">boîte(s)</div></td>
    </tr>`;
  }).join("");
  ov.innerHTML = `<div class="ocr" role="dialog" aria-label="Lecture d'ordonnance">
    <div class="ocr-head"><h2>Lire une ordonnance</h2>
      <span class="pill ${aiOn ? "info" : "warn"}">${!AI.checked ? "…" : aiOn ? "IA activée (Claude)" : "Mode simulation"}</span>
      <button class="btn sm" data-act="ocr-close" aria-label="Fermer">Fermer</button></div>
    <div class="ocr-grid">
      <div class="ocr-left">
        <div class="row">${RX_SAMPLES.map(r => `<button class="chip" data-act="ocr-sample" data-id="${r.id}" aria-pressed="${o.src?.id === r.id}">Exemple : ${r.label}</button>`).join("")}</div>
        ${aiOn ? `<label class="f">Ou une photo d'ordonnance<input class="in" type="file" accept="image/*" id="ocrFile"></label>` : `<p class="small muted" style="margin:0">${AI.checked ? "Ouvrez cette démo depuis Claude pour lire vos propres photos avec l'IA. Ici, le résultat des exemples est préparé à l'avance." : ""}</p>`}
        ${o.imgUrl ? `<img class="ocr-img" src="${o.imgUrl}" alt="Ordonnance à lire">` : `<div class="empty">Choisissez un exemple${aiOn ? " ou une photo" : ""}.</div>`}
        <button class="btn primary" data-act="ocr-read" ${o.blob && o.status !== "reading" ? "" : "disabled"}>${o.status === "reading" ? "Lecture en cours…" : "Lire l'ordonnance"}</button>
      </div>
      <div class="ocr-right">
        ${o.msg ? `<div class="${o.status === "error" ? "err" : "note"}">${esc(o.msg)}</div>` : ""}
        ${o.status === "done" ? `
          ${o.mode === "sim" ? `<div class="note">Simulation : résultat préparé à l'avance pour cet exemple.</div>` : ""}
          <div class="row">
            <label class="f">Prescripteur<input class="in" data-ocr-rx="presc" value="${esc(o.rx.presc)}"></label>
            <label class="f">Patient<input class="in" data-ocr-rx="patient" value="${esc(o.rx.patient)}"></label>
            <label class="f">Date<input class="in" type="date" data-ocr-rx="date" value="${esc(o.rx.date)}"></label>
          </div>
          <div class="tbl-wrap"><table><thead><tr><th></th><th>Lu sur l'ordonnance</th><th>Produit</th><th class="r">Qté</th></tr></thead><tbody>${rows || `<tr><td colspan="4" class="empty">Aucun médicament reconnu.</td></tr>`}</tbody></table></div>
          <p class="small muted" style="margin:0">Quantité = prises par jour × durée ÷ unités par boîte, arrondie au-dessus. Le pharmacien vérifie chaque ligne avant de délivrer.</p>
          <button class="btn primary big" data-act="ocr-basket" ${o.lines.some(l => l.take && l.pid) ? "" : "disabled"}>Ajouter au panier et remplir l'ordonnance</button>`
        : o.status === "reading" ? `<div class="empty">Lecture en cours… (quelques secondes avec l'IA)</div>`
        : o.status === "idle" ? `<div class="empty">Le résultat s'affichera ici : médicaments lus, produit du stock correspondant, nombre de boîtes.</div>` : ""}
        <p class="small muted" style="margin:0">Données de santé : en production, la photo n'est envoyée à un service d'IA qu'avec le consentement du patient et l'autorisation de l'INPDP. Ici, utilisez les exemples ou une ordonnance fictive.</p>
      </div>
    </div></div>`;
  ov.hidden = false;
}
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act^='ocr'], [data-ocr='gen']"); if (!el) return;
  const a = el.dataset.act, o = S.ocr;
  if (a === "ocr-open") { o.open = true; renderOcr(); }
  else if (a === "ocr-close") { o.open = false; const ov = document.getElementById("overlay"); ov.hidden = true; ov.innerHTML = ""; }
  else if (a === "ocr-sample") openSample(el.dataset.id);
  else if (a === "ocr-read") readRx();
  else if (a === "ocr-basket") ocrToBasket();
  else if (el.dataset.ocr === "gen") { const l = o.lines[+el.dataset.i]; l.pid = el.dataset.p; l.qty = boxesFor(l); l.take = true; renderOcr(); }
});
document.addEventListener("change", e => {
  const el = e.target, o = S.ocr; if (!o.open) return;
  if (el.id === "ocrFile" && el.files?.[0]) {
    const f = el.files[0]; o.src = null; o.blob = f; o.status = "idle"; o.lines = []; o.msg = "";
    const rd = new FileReader(); rd.onload = () => { o.imgUrl = rd.result; renderOcr(); }; rd.readAsDataURL(f);
  } else if (el.dataset.ocr === "take") { o.lines[+el.dataset.i].take = el.checked; renderOcr(); }
  else if (el.dataset.ocr === "pid") { const l = o.lines[+el.dataset.i]; l.pid = el.value || null; l.take = !!l.pid; if (l.pid) l.qty = boxesFor(l); renderOcr(); }
  else if (el.dataset.ocr === "qty") { o.lines[+el.dataset.i].qty = Math.max(1, parseInt(el.value, 10) || 1); renderOcr(); }
  else if (el.dataset.ocrRx) { o.rx[el.dataset.ocrRx] = el.value; }
});

window.addEventListener("hashchange", () => { if (!S.auth.in) return; S.error = ""; render(); window.scrollTo(0, 0); });
render();
document.querySelector("#loginForm .btn.primary")?.focus();
</script>
</body>
